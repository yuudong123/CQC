# Isolated real Backend -> Inference integration test; does not replace compose.yaml.
services:
  inference:
    image: cqc-inference-acceptance:latest
    command: ["python", "-m", "src.inference.api", "--model-dir", "/app/models/approved", "--device", "cpu", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${INFERENCE_MODEL_DIR:?Set the local model package directory}
        target: /app/models/approved
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      INFERENCE_CLIENT_MODE: http
      INFERENCE_URL: http://inference:8001/v1/predict
    depends_on:
      inference:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INTEGRATION_BACKEND_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
