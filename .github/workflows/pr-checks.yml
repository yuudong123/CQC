name: PR checks

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-backend-dev.txt
      - run: python -m pytest -q tests/api tests/simulator tests/ci tests/test_service_logging.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cqc-logistics-platform/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cqc-logistics-platform/apps/web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
