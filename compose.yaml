# ============================================================
# CQC Docker Compose
# WBS: MO-04
# 담당: 홍유나
# 목적:
# - CQC 프로젝트의 5개 실행 단위를 Docker Compose로 관리
# - 각 서비스의 healthcheck를 통해 정상 상태 확인
# - 서비스 간 기동 순서를 service_healthy 기준으로 제어
#
# 현재 MO-04 반영 범위:
# - mysql healthcheck 적용
# - inference placeholder healthcheck 적용
# - backend healthcheck 적용
# - backend는 mysql / inference가 healthy 상태 이후 기동
# - frontend / simulator는 backend가 healthy 상태 이후 기동
# - 모든 서비스에 restart: unless-stopped 유지
#
# 현재 기동 구조:
#   MySQL ─────┐
#              ├→ Backend → Simulator
#   Inference ─┘          └→ Frontend
#
# 이후 작업:
# - inference 실제 API 구현 시 placeholder healthcheck를 실제 /health 검사로 교체
# - backend 실제 FastAPI 구현 시 placeholder healthcheck를 실제 /health 검사로 교체
# - 실제 Frontend / Simulator 실행 파일 준비 시 placeholder command 교체
# - Volume / 비밀값 관리 → MO-05
# ============================================================

services:
  # ==========================================================
  # MySQL
  # ==========================================================
  # 검사 결과, 통계, 제어 결과 등의 데이터를 저장하는 DB 서비스
  #
  # 현재 MySQL 사용은 프로젝트에서 확정된 상태이며,
  # 실제 테이블 구조와 마이그레이션 방식은 Backend 작업에서 결정한다.
  #
  # MO-04에서는 MySQL 컨테이너 기본 설정과 함께
  # 실제 연결 가능 여부를 확인하는 healthcheck를 적용한다.
  # ==========================================================
  mysql:
    # MySQL 공식 Docker 이미지 사용
    image: mysql:8.4

    # 컨테이너가 비정상 종료되거나 Docker가 재시작되면 자동 재시작
    # 단, 사용자가 직접 중지한 경우에는 자동으로 다시 실행하지 않음
    restart: unless-stopped

    # MySQL 초기 실행에 필요한 환경 변수
    #
    # ${환경변수:-기본값}
    # 형태는 환경 변수가 존재하면 해당 값을 사용하고,
    # 없으면 뒤의 기본값을 사용하는 Docker Compose 문법이다.
    #
    # 실제 배포 시 비밀번호는 .env에서 관리할 예정
    environment:
      # MySQL root 계정 비밀번호
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

      # 최초 생성할 기본 DB 이름
      MYSQL_DATABASE: ${MYSQL_DATABASE}

      # 프로젝트에서 사용할 일반 DB 사용자
      MYSQL_USER: ${MYSQL_USER}

      # 일반 DB 사용자의 비밀번호
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    # ==========================================================
    # MO-04 Healthcheck
    # ==========================================================
    # 단순히 컨테이너가 실행 중인지가 아니라,
    # MySQL이 실제 연결 요청을 받을 수 있는 상태인지 확인한다.
    #
    # $$MYSQL_ROOT_PASSWORD:
    # Compose가 아닌 컨테이너 내부 환경 변수의 값을 사용하기 위해
    # $ 문자를 두 번 작성한다.
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================
  # Inference
  # ==========================================================
  # AI 모델 추론을 담당하는 서비스
  #
  # Backend가 HTTP 요청으로 이미지를 전달하면
  # 품종 / 품질 예측 결과와 신뢰도 등을 반환하는 역할이다.
  #
  # 현재 실제 inference Dockerfile 및 실행 명령이 아직 연결되지 않아
  # Alpine Linux 이미지를 이용한 placeholder 상태로 구성한다.
  #
  # MO-04에서는 placeholder 컨테이너가 정상 기동했는지 healthcheck로 확인한다.
  # 실제 inference API가 구현되면 image / command와 healthcheck를 함께 교체한다.
  # ==========================================================
  inference:
    # 실제 추론 이미지가 준비되기 전 임시 컨테이너
    image: alpine:3.20

    # Docker 또는 컨테이너 재시작 시 자동 복구
    restart: unless-stopped

    # 실제 추론 서버가 아직 연결되지 않았기 때문에
    # placeholder 정상 기동 표시 파일을 생성한 뒤 컨테이너를 유지한다.
    command:
      - sh
      - -c
      - |
        echo "[MO-04 placeholder] inference"
        touch /tmp/inference-healthy
        tail -f /dev/null

    # ==========================================================
    # MO-04 Healthcheck
    # ==========================================================
    # 현재는 실제 inference 서버가 없으므로 placeholder용 검사이다.
    # 추후 inference API가 구현되면 /health 등의 실제 엔드포인트 검사로 교체한다.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/inference-healthy
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================================
  # Backend
  # ==========================================================
  # CQC 전체 검사 흐름을 제어하는 핵심 API 서비스
  #
  # 주요 역할:
  # - simulator 입력 수신
  # - inference 호출
  # - 품종 / 품질 결과 처리
  # - 신뢰도 및 재검사 정책 처리
  # - Virtual Control / bin 판정
  # - MySQL 검사 이력 저장
  # - Frontend용 API 제공
  #
  # Backend는 FastAPI 사용이 확정되어 있지만
  # 실제 Dockerfile과 실행 명령이 아직 연결되지 않아 placeholder를 사용한다.
  # MO-04에서는 MySQL / Inference가 healthy 상태가 된 뒤 기동되도록 구성한다.
  # ==========================================================
  backend:
    # 실제 Backend Docker 이미지가 준비되기 전 임시 이미지
    image: alpine:3.20

    # 서비스 비정상 종료 시 자동 재시작
    restart: unless-stopped

    # ==========================================================
    # MO-04 기동 의존성
    # ==========================================================
    # Backend는 DB와 AI 추론 서비스를 모두 사용하므로,
    # 두 서비스가 단순 실행 상태가 아니라 healthy 상태가 된 뒤 기동한다.
    depends_on:
      mysql:
        condition: service_healthy
      inference:
        condition: service_healthy

    # 실제 FastAPI 실행 명령이 연결되면 현재 placeholder command를 교체한다.
    command:
      - sh
      - -c
      - |
        echo "[MO-04 placeholder] backend"
        touch /tmp/backend-healthy
        tail -f /dev/null

    # ==========================================================
    # MO-04 Healthcheck
    # ==========================================================
    # 현재는 실제 FastAPI 서버가 없으므로 placeholder용 검사이다.
    # 추후 Backend API가 구현되면 /health 등의 실제 엔드포인트 검사로 교체한다.
    healthcheck:
      test:
        - CMD-SHELL
        - test -f /tmp/backend-healthy
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================================
  # Frontend
  # ==========================================================
  # 사용자에게 검사 상태와 결과를 보여주는 웹 서비스
  #
  # 주요 화면 예시:
  # - 현재 검사 상태
  # - 품종 / 품질 판정 결과
  # - 최근 검사 이력
  # - 통계 / 차트
  # - 시스템 상태
  #
  # 현재 Frontend는 placeholder 상태이며,
  # MO-04에서는 Backend가 healthy 상태가 된 뒤 기동되도록 의존성을 적용한다.
  # 실제 Frontend 실행 구성이 준비되면 image / build / command 설정을 교체한다.
  # ==========================================================
  frontend:
    # 실제 Frontend Docker 이미지가 준비되기 전 임시 이미지
    image: alpine:3.20

    # 서비스가 비정상 종료되었을 때 자동 재시작
    restart: unless-stopped

    # ==========================================================
    # MO-04 기동 의존성
    # ==========================================================
    # Frontend는 Backend API를 사용하므로,
    # Backend가 healthy 상태가 된 뒤 기동한다.
    depends_on:
      backend:
        condition: service_healthy

    # 현재 Frontend 실행 코드가 없으므로 placeholder 컨테이너를 유지한다.
    command:
      - sh
      - -c
      - |
        echo "[MO-04 placeholder] frontend"
        tail -f /dev/null

  # ==========================================================
  # Simulator
  # ==========================================================
  # 실제 농산물 검사 장비 대신
  # 저장된 사과 이미지 그룹을 자동으로 Backend에 전달하는 서비스
  #
  # 실제 프로젝트에서는 일정 간격으로 이미지 그룹을 전송하여
  # 실제 검사 라인과 비슷한 흐름을 재현하는 역할을 한다.
  #
  # 목표:
  # - 약 500ms 간격 입력
  # - 초당 사과 그룹 2개 처리 환경 재현
  #
  # 현재 Simulator는 placeholder 상태이며,
  # MO-04에서는 Backend가 healthy 상태가 된 뒤 기동되도록 의존성을 적용한다.
  # 실제 Simulator 코드가 연결되면 현재 command를 교체한다.
  # ==========================================================
  simulator:
    # 실제 Simulator 이미지가 준비되기 전 임시 이미지
    image: alpine:3.20

    # Docker 재시작 후에도 서비스 자동 재실행
    restart: unless-stopped

    # ==========================================================
    # MO-04 기동 의존성
    # ==========================================================
    # Simulator는 Backend로 검사 입력을 전송하므로,
    # Backend가 healthy 상태가 된 뒤 기동한다.
    depends_on:
      backend:
        condition: service_healthy

    # Simulator 코드가 아직 없기 때문에
    # placeholder 안내 문구 출력 후 컨테이너를 계속 유지한다.
    command:
      - sh
      - -c
      - |
        echo "[MO-04 placeholder] simulator"
        tail -f /dev/null

  # CQC 판정 결과를 경매·배차·배송 관제로 연결하는 물류 확장 서비스다.
  # GPU를 사용하지 않으며 Jenkins가 다른 CQC 서비스와 함께 배포한다.
  logistics-mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - logistics_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  logistics-api:
    build:
      context: ./cqc-logistics-platform/apps/api
    restart: unless-stopped
    environment:
      MONGODB_URL: mongodb://logistics-mongodb:27017
      MONGODB_DATABASE: ${LOGISTICS_MONGODB_DATABASE:-cqc_logistics}
      STORE_MODE: mongo
      CORS_ORIGINS: ${LOGISTICS_PUBLIC_WEB_ORIGIN:-http://localhost:3100}
    ports:
      - "${LOGISTICS_API_PORT:-8100}:8000"
    depends_on:
      logistics-mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  logistics-web:
    build:
      context: ./cqc-logistics-platform/apps/web
      args:
        NEXT_PUBLIC_API_URL: ${LOGISTICS_PUBLIC_API_URL:-http://localhost:8100/api/v1}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    ports:
      - "${LOGISTICS_WEB_PORT:-3100}:3000"
    depends_on:
      logistics-api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
  logistics_mongodb_data:
